<!doctype html>
<html lang="en">
<head>
  <!-- META PIXEL HERE -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Join The Fastest Growing Forex Community</title>
  <meta name="description" content="Join our FREE Forex community. Daily insights, live discussions, beginner friendly." />
  <meta name="theme-color" content="#050505" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Open Graph (Facebook / Instagram ads). Replace YOUR-DOMAIN.com with your live domain. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Join The Fastest Growing Forex Community" />
  <meta property="og:description" content="Join our FREE Forex community. Daily insights, live discussions, beginner friendly." />
  <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
  <meta property="og:image" content="https://YOUR-DOMAIN.com/logo.png" />
  <meta property="og:image:width" content="520" />
  <meta property="og:image:height" content="520" />
  <meta property="og:image:alt" content="Forex community logo" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Join The Fastest Growing Forex Community" />
  <meta name="twitter:description" content="Join our FREE Forex community. Daily insights, live discussions, beginner friendly." />
  <meta name="twitter:image" content="https://YOUR-DOMAIN.com/logo.png" />

  <link rel="icon" type="image/png" href="./logo.png" />
  <link rel="apple-touch-icon" href="./logo.png" />
  <link rel="preload" as="image" href="./logo.png" fetchpriority="high" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] },
          colors: { ink: '#050505', panel: '#0A0A0A', mute: '#A1A1AA' }
        }
      }
    };
  </script>

  <!-- Critical styles: render correctly before Tailwind finishes loading -->
  <style>
    html { background: #050505; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #050505;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Background: black with soft orange glows top + bottom */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(420px 320px at 50% 0%, rgba(255, 92, 0, 0.30) 0%, rgba(255, 61, 0, 0.10) 45%, transparent 75%),
        radial-gradient(460px 280px at 50% 100%, rgba(255, 92, 0, 0.22) 0%, rgba(255, 61, 0, 0.06) 50%, transparent 80%),
        linear-gradient(180deg, #0A0A0A 0%, #050505 50%, #0A0A0A 100%);
    }
    .orb {
      position: absolute; pointer-events: none; border-radius: 9999px;
      background: radial-gradient(circle at 35% 30%, rgba(255, 140, 60, 0.35), rgba(120, 40, 0, 0.15) 55%, transparent 72%);
      filter: blur(2px);
    }

    /* Logo */
    .logo-wrap {
      width: 110px; height: 110px;
      border-radius: 9999px;
      background: #050505;
      border: 2px solid rgba(255, 122, 0, 0.85);
      box-shadow:
        0 0 0 6px rgba(255, 92, 0, 0.10),
        0 0 28px 4px rgba(255, 92, 0, 0.45),
        0 12px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 9%; display: block; }

    /* Headline */
    .headline {
      font-size: clamp(26px, 8.8vw, 39px); /* sized to the 430px column, never grows on desktop */
      line-height: 1.02;
      letter-spacing: -0.03em;
    }
    .text-fire {
      background: linear-gradient(90deg, #FF3D00 0%, #FF7A00 50%, #FFB300 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: #FF7A00;
      filter: drop-shadow(0 0 18px rgba(255, 106, 0, 0.45));
    }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(90deg, #FF3D00 0%, #FF8A00 100%);
      box-shadow: 0 10px 30px -6px rgba(255, 72, 0, 0.65), 0 0 0 1px rgba(255, 160, 80, 0.25) inset;
    }
    .btn-secondary {
      background: #0A0A0A;
      border: 1.5px solid #FF7A00;
      box-shadow: 0 0 20px -6px rgba(255, 122, 0, 0.45);
    }
    .btn { transition: transform .15s ease, box-shadow .15s ease; touch-action: manipulation; }
    @media (hover: hover) { .btn:hover { transform: scale(1.025); } }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 2px solid #FFB300; outline-offset: 3px; }

    /* Video */
    .video-box {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: 20px;
      overflow: hidden;
      background: #0A0A0A;
      border: 1px solid #FF7A00;
      box-shadow: 0 0 20px -6px rgba(255, 122, 0, 0.45);
    }
    .video-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0A0A0A; }
    .video-cover {
      position: absolute; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      width: 100%; border: 0; padding: 0; cursor: pointer;
      background: #0A0A0A; color: #fff; font: inherit;
      touch-action: manipulation;
    }
    .video-cover::before {
      content: ""; position: absolute; inset: -10%;
      background: url("./logo.png") center / contain no-repeat;
      opacity: 0.15; filter: blur(6px);
    }
    .video-cover::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(50% 60% at 50% 45%, rgba(255, 92, 0, 0.16), transparent 70%);
    }
    .video-box.is-playing .video-cover { display: none; }
    .play-btn {
      position: relative; z-index: 1;
      width: 72px; height: 72px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #FF3D00 0%, #FF8A00 100%);
      box-shadow: 0 0 0 6px rgba(255, 92, 0, 0.14), 0 10px 30px -4px rgba(255, 72, 0, 0.7);
      transition: transform .15s ease;
    }
    .play-btn::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      border: 2px solid rgba(255, 122, 0, 0.7);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: .8; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @media (hover: hover) { .video-cover:hover .play-btn { transform: scale(1.06); } }
    .video-cover:active .play-btn { transform: scale(0.96); }
    .video-cover:focus-visible { outline: 2px solid #FFB300; outline-offset: -4px; }
    .video-label { position: relative; z-index: 1; font-size: 14px; font-weight: 600; color: #fff; letter-spacing: .01em; }
    /* Tap-to-pause layer: covers the picture, leaves the bottom control bar free */
    .video-tap {
      position: absolute; left: 0; right: 0; top: 0; bottom: 64px; z-index: 1;
      display: none; align-items: center; justify-content: center;
      border: 0; padding: 0; background: transparent; cursor: pointer;
      touch-action: manipulation;
    }
    .video-box.is-playing .video-tap { display: flex; }
    .video-tap .play-btn { opacity: 0; transition: opacity .15s ease; }
    .video-box.is-paused .video-tap .play-btn { opacity: 1; }
    .video-tap:focus-visible { outline: 2px solid #FFB300; outline-offset: -4px; }

    /* Brand footer */
    .brand-footer {
      font-size: 12px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase;
      background: linear-gradient(90deg, #FF3D00 0%, #FF8A00 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: #FF7A00;
    }

    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .play-btn::before { animation: none; } }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <main class="relative z-10 mx-auto w-full max-w-[430px] px-5 pt-12 pb-8 flex flex-col items-center text-center">
    <div class="absolute inset-0 overflow-hidden pointer-events-none -z-10" aria-hidden="true">
      <div class="orb" style="width:120px;height:120px;left:-40px;top:470px;"></div>
      <div class="orb" style="width:70px;height:70px;right:-20px;top:590px;opacity:.7;"></div>
    </div>

    <!-- 1. Hero logo -->
    <div class="logo-wrap">
      <img src="./logo.png" alt="Forex community logo" width="520" height="520" fetchpriority="high" decoding="async" />
    </div>

    <!-- 2. Headline -->
    <h1 class="headline mt-7 font-black uppercase">
      <span class="block text-white">Join the fastest<br />growing</span>
      <span class="block text-fire whitespace-nowrap">Forex community</span>
    </h1>

    <!-- 3. Subheadline -->
    <p class="mt-5 text-[16px] leading-relaxed text-mute">
      Learn, connect, and grow with traders from around the world. Daily insights, live discussions, and a community built for real traders &ndash; <span class="text-white font-semibold">beginner friendly, no hype.</span>
    </p>

    <!-- Video: plays ./video.mp4 (9:16 Reels). Tap the picture to play / pause. -->
    <div class="video-box mt-6 w-full" id="video-box">
      <video id="promo-video" controls playsinline preload="metadata" poster="./logo.png">
        <source src="./video.mp4" type="video/mp4">
      </video>
      <button type="button" class="video-cover" id="video-cover" aria-label="Watch video">
        <span class="play-btn" aria-hidden="true">
          <svg class="w-7 h-7 ml-1" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.6-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z" /></svg>
        </span>
        <span class="video-label">Watch Video</span>
      </button>
      <button type="button" class="video-tap" id="video-tap" aria-label="Play or pause video">
        <span class="play-btn" aria-hidden="true">
          <svg class="w-7 h-7 ml-1" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.6-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z" /></svg>
        </span>
      </button>
    </div>

    <!-- 4. CTA buttons -->
    <div class="mt-6 w-full flex flex-col gap-4">
      <!-- PRIMARY: replace href with your Telegram public channel link -->
      <a href="https://t.me/YOUR_PUBLIC_CHANNEL"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-primary w-full h-14 rounded-full flex items-center justify-center gap-3 px-5 text-white font-bold whitespace-nowrap text-[clamp(15px,4.3vw,17px)]">
        <svg class="w-[22px] h-[22px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13" />
          <path d="M22 2 15 22l-4-9-9-4 20-7z" />
        </svg>
        <span>Join FREE Public Channel NOW</span>
      </a>

      <!-- SECONDARY: replace href with your Telegram DM link (e.g. https://t.me/yourusername) -->
      <a href="https://t.me/YOUR_USERNAME"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-secondary w-full h-14 rounded-full flex items-center justify-center gap-3 px-5 text-white font-bold whitespace-nowrap text-[clamp(15px,4.3vw,17px)]">
        <svg class="w-[22px] h-[22px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z" />
        </svg>
        <span>Send me a private message!</span>
      </a>
    </div>

    <footer class="brand-footer mt-8">Fastest Forex Community</footer>
  </main>

  <script>
    // Play-button cover: hides once the video plays, comes back when it ends.
    // While started, tapping the picture toggles play / pause.
    // If video.mp4 is missing, the cover simply stays in place.
    (function () {
      var box = document.getElementById('video-box');
      var video = document.getElementById('promo-video');
      var cover = document.getElementById('video-cover');
      var tap = document.getElementById('video-tap');
      var source = video.querySelector('source');
      var missing = false;

      source.addEventListener('error', function () { missing = true; });
      video.addEventListener('error', function () { missing = true; });

      function play() {
        if (missing || video.networkState === 3) return;
        var p = video.play();
        if (p && p.catch) p.catch(function () { box.classList.remove('is-playing'); });
      }

      cover.addEventListener('click', play);
      tap.addEventListener('click', function () {
        if (video.paused) play(); else video.pause();
      });
      video.addEventListener('play', function () {
        box.classList.add('is-playing');
        box.classList.remove('is-paused');
      });
      video.addEventListener('pause', function () {
        if (!video.ended) box.classList.add('is-paused');
      });
      video.addEventListener('ended', function () {
        box.classList.remove('is-playing', 'is-paused');
      });
    })();
  </script>
</body>
</html>
