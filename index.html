<!doctype html>
<html lang="en">
<head>
  <!-- META PIXEL HERE -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Join The Fastest Growing Forex Community</title>
  <meta name="description" content="Join our FREE Forex community. Daily insights, live discussions, beginner friendly." />
  <meta name="theme-color" content="#050505" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Open Graph (Facebook / Instagram ads). Replace YOUR-DOMAIN.com with your live domain. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Join The Fastest Growing Forex Community" />
  <meta property="og:description" content="Join our FREE Forex community. Daily insights, live discussions, beginner friendly." />
  <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
  <meta property="og:image" content="https://YOUR-DOMAIN.com/logo.png" />
  <meta property="og:image:width" content="520" />
  <meta property="og:image:height" content="520" />
  <meta property="og:image:alt" content="Forex community logo" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Join The Fastest Growing Forex Community" />
  <meta name="twitter:description" content="Join our FREE Forex community. Daily insights, live discussions, beginner friendly." />
  <meta name="twitter:image" content="https://YOUR-DOMAIN.com/logo.png" />

  <link rel="icon" type="image/png" href="./logo.png" />
  <link rel="apple-touch-icon" href="./logo.png" />
  <link rel="preload" as="image" href="./logo.png" fetchpriority="high" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] },
          colors: { ink: '#050505', panel: '#0A0A0A', mute: '#A1A1AA' }
        }
      }
    };
  </script>

  <!-- Critical styles: render correctly before Tailwind finishes loading -->
  <style>
    html { background: #050505; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #050505;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Background: black with soft orange glows top + bottom */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(420px 320px at 50% 0%, rgba(255, 92, 0, 0.30) 0%, rgba(255, 61, 0, 0.10) 45%, transparent 75%),
        radial-gradient(460px 280px at 50% 100%, rgba(255, 92, 0, 0.22) 0%, rgba(255, 61, 0, 0.06) 50%, transparent 80%),
        linear-gradient(180deg, #0A0A0A 0%, #050505 50%, #0A0A0A 100%);
    }
    .orb {
      position: absolute; pointer-events: none; border-radius: 9999px;
      background: radial-gradient(circle at 35% 30%, rgba(255, 140, 60, 0.35), rgba(120, 40, 0, 0.15) 55%, transparent 72%);
      filter: blur(2px);
    }

    /* Logo */
    .logo-wrap {
      width: 110px; height: 110px;
      border-radius: 9999px;
      background: #050505;
      border: 2px solid rgba(255, 122, 0, 0.85);
      box-shadow:
        0 0 0 6px rgba(255, 92, 0, 0.10),
        0 0 28px 4px rgba(255, 92, 0, 0.45),
        0 12px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 9%; display: block; }

    /* Headline */
    .headline {
      font-size: clamp(26px, 8.8vw, 39px); /* sized to the 430px column, never grows on desktop */
      line-height: 1.02;
      letter-spacing: -0.03em;
    }
    .text-fire {
      background: linear-gradient(90deg, #FF3D00 0%, #FF7A00 50%, #FFB300 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: #FF7A00;
      filter: drop-shadow(0 0 18px rgba(255, 106, 0, 0.45));
    }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(90deg, #FF3D00 0%, #FF8A00 100%);
      box-shadow: 0 10px 30px -6px rgba(255, 72, 0, 0.65), 0 0 0 1px rgba(255, 160, 80, 0.25) inset;
    }
    .btn-secondary {
      background: #0A0A0A;
      border: 1.5px solid #FF7A00;
      box-shadow: 0 0 20px -6px rgba(255, 122, 0, 0.45);
    }
    .btn { transition: transform .15s ease, box-shadow .15s ease; touch-action: manipulation; }
    @media (hover: hover) { .btn:hover { transform: scale(1.025); } }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 2px solid #FFB300; outline-offset: 3px; }

    /* Video */
    .video-box {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: 20px;
      overflow: hidden;
      background: #0A0A0A;
      border: 1px solid #FF7A00;
      box-shadow: 0 0 20px -6px rgba(255, 122, 0, 0.45);
    }
    .video-box { cursor: pointer; touch-action: manipulation; }
    /* Faint logo while the video loads */
    .video-box::before {
      content: ""; position: absolute; inset: -10%;
      background: url("./logo.png") center / contain no-repeat;
      opacity: 0.15; filter: blur(6px);
    }
    .video-box video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      opacity: 0; transition: opacity .3s ease;
    }
    .video-box.is-ready video { opacity: 1; }
    /* Mute / unmute toggle, bottom-right */
    .mute-btn {
      position: absolute; right: 12px; bottom: 12px; z-index: 2;
      width: 36px; height: 36px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      border: 0; padding: 0; cursor: pointer;
      background: rgba(0, 0, 0, 0.7); color: #fff;
    }
    .mute-btn:focus-visible { outline: 2px solid #FFB300; outline-offset: 2px; }
    .mute-btn .icon-on { display: none; }
    .video-box.is-unmuted .mute-btn .icon-on { display: block; }
    .video-box.is-unmuted .mute-btn .icon-off { display: none; }

    /* Brand footer */
    .brand-footer {
      font-size: 12px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase;
      background: linear-gradient(90deg, #FF3D00 0%, #FF8A00 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: #FF7A00;
    }

    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <main class="relative z-10 mx-auto w-full max-w-[430px] px-5 pt-12 pb-8 flex flex-col items-center text-center">
    <div class="absolute inset-0 overflow-hidden pointer-events-none -z-10" aria-hidden="true">
      <div class="orb" style="width:120px;height:120px;left:-40px;top:470px;"></div>
      <div class="orb" style="width:70px;height:70px;right:-20px;top:590px;opacity:.7;"></div>
    </div>

    <!-- 1. Hero logo -->
    <div class="logo-wrap">
      <img src="./logo.png" alt="Forex community logo" width="520" height="520" fetchpriority="high" decoding="async" />
    </div>

    <!-- 2. Headline -->
    <h1 class="headline mt-7 font-black uppercase">
      <span class="block text-white">Join the fastest<br />growing</span>
      <span class="block text-fire whitespace-nowrap">Forex community</span>
    </h1>

    <!-- 3. Subheadline -->
    <p class="mt-5 text-[16px] leading-relaxed text-mute">
      Learn, connect, and grow with traders from around the world. Daily insights, live discussions, and a community built for real traders &ndash; <span class="text-white font-semibold">beginner friendly, no hype.</span>
    </p>

    <!-- Video: autoplays ./video.mp4 muted on loop (9:16 Reels). Tap anywhere on it to turn sound on / off. -->
    <div class="video-box mt-6 w-full" id="video-box">
      <video id="promo-video" autoplay muted loop playsinline preload="auto" poster="./logo.png">
        <source src="./video.mp4" type="video/mp4">
      </video>
      <button type="button" class="mute-btn" id="mute-btn" aria-label="Turn sound on" aria-pressed="false">
        <svg class="icon-off w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z" /><path d="m23 9-6 6" /><path d="m17 9 6 6" />
        </svg>
        <svg class="icon-on w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
      </button>
    </div>

    <!-- 4. CTA buttons -->
    <div class="mt-6 w-full flex flex-col gap-4">
      <!-- PRIMARY: replace href with your Telegram public channel link -->
      <a href="https://t.me/YOUR_PUBLIC_CHANNEL"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-primary w-full h-14 rounded-full flex items-center justify-center gap-3 px-5 text-white font-bold whitespace-nowrap text-[clamp(15px,4.3vw,17px)]">
        <svg class="w-[22px] h-[22px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 2 11 13" />
          <path d="M22 2 15 22l-4-9-9-4 20-7z" />
        </svg>
        <span>Join FREE Public Channel NOW</span>
      </a>

      <!-- SECONDARY: replace href with your Telegram DM link (e.g. https://t.me/yourusername) -->
      <a href="https://t.me/YOUR_USERNAME"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-secondary w-full h-14 rounded-full flex items-center justify-center gap-3 px-5 text-white font-bold whitespace-nowrap text-[clamp(15px,4.3vw,17px)]">
        <svg class="w-[22px] h-[22px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z" />
        </svg>
        <span>Send me a private message!</span>
      </a>
    </div>

    <footer class="brand-footer mt-8">Fastest Forex Community</footer>
  </main>

  <script>
    // Autoplay muted on loop. Tapping the video (or the speaker button) toggles sound.
    // If the browser blocked autoplay (e.g. iPhone Low Power Mode), the first tap starts it with sound.
    (function () {
      var box = document.getElementById('video-box');
      var video = document.getElementById('promo-video');
      var muteBtn = document.getElementById('mute-btn');

      function play() {
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      }

      function syncSound() {
        var on = !video.muted;
        box.classList.toggle('is-unmuted', on);
        muteBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
        muteBtn.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on');
      }

      function reveal() { box.classList.add('is-ready'); }
      video.addEventListener('loadeddata', reveal);
      video.addEventListener('playing', reveal);
      if (video.readyState >= 2) reveal();

      box.addEventListener('click', function () {
        if (video.paused) { video.muted = false; play(); }
        else video.muted = !video.muted;
      });
      video.addEventListener('volumechange', syncSound);

      video.muted = true;
      play();
    })();
  </script>
</body>
</html>
